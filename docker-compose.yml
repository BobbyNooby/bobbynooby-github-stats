services:
  github-stats:
    build: .
    image: github-stats
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DB_PATH: /data/stats.db
      PORT: 3000 # container-internal listen port must match EXPOSE/compose mapping
    volumes:
      - ./data:/data
